version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=1
      - FLASK_APP=app.py
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=sqlite:///dev.db
      - PORT=5000
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0 --port=5000
    restart: unless-stopped
